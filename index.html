<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credenciales de Acceso - FENSTER</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f4efe6;
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .instruction {
      margin-bottom: 25px;
      font-size: 14px;
      color: #6b5b4e;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .container {
      position: relative;
      width: 440px;
      height: 270px;
      cursor: pointer;
    }
    .envelope {
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: #d3b185;
      border-radius: 8px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);
    }
    .flap {
      position: absolute;
      top: 0;
      width: 0;
      height: 0;
      border-left: 220px solid transparent;
      border-right: 220px solid transparent;
      border-top: 145px solid #b89264;
      transform-origin: top;
      transition: transform 0.6s ease-in-out, z-index 0.6s;
      z-index: 3;
    }
    .pocket {
      position: absolute;
      bottom: 0;
      width: 0;
      height: 0;
      border-left: 220px solid #c49e70;
      border-right: 220px solid #c49e70;
      border-bottom: 135px solid #ad8759;
      border-radius: 0 0 8px 8px;
      z-index: 3;
    }
    .seal {
      position: absolute;
      top: 110px;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 56px;
      background: radial-gradient(circle, #a81c1c 0%, #6e0d0d 100%);
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #f1c40f;
      font-size: 24px;
      z-index: 4;
      transition: opacity 0.4s ease, transform 0.4s ease;
      user-select: none;
      border: 1px solid #540808;
    }
    .letter {
      position: absolute;
      bottom: 12px;
      left: 15px;
      width: 410px;
      height: 245px;
      background-color: #fffdfa;
      border: 1px solid #e0d7c6;
      border-radius: 6px;
      padding: 18px 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      transition: transform 0.7s ease-in-out;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .letter h2 {
      font-size: 15px;
      color: #4a3b32;
      text-align: center;
      border-bottom: 1px dashed #d5c8b5;
      padding-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .cred-table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0;
      font-size: 12px;
    }
    .cred-table th, .cred-table td {
      padding: 5px 6px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    .cred-table th {
      color: #8b0000;
      font-size: 11px;
      text-transform: uppercase;
    }
    .value-box {
      background: #f4efea;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      border: 1px solid #e2dad0;
    }
    .link-container {
      text-align: center;
      margin-top: 6px;
    }
    .btn-link {
      display: inline-block;
      background-color: #8b0000;
      color: #fff;
      padding: 7px 16px;
      text-decoration: none;
      border-radius: 4px;
      font-size: 12px;
      font-family: sans-serif;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    .btn-link:hover {
      background-color: #6e0d0d;
    }

    /* Estado de apertura */
    .container.open .flap {
      transform: rotateX(180deg);
      z-index: 1;
    }
    .container.open .seal {
      opacity: 0;
      transform: translateX(-50%) scale(0.4);
      pointer-events: none;
    }
    .container.open .letter {
      transform: translateY(-190px);
      z-index: 4;
    }
  </style>
</head>
<body>

  <div class="instruction">Haz clic en el sello para abrir</div>

  <div class="container" id="envelopeContainer" onclick="openEnvelope()">
    <div class="envelope"></div>
    <div class="flap"></div>
    <div class="seal">★</div>
    <div class="pocket"></div>
    <div class="letter">
      <h2>CREDANCIALES DE ACCESO - FENSTER</h2>
      
      <table class="cred-table">
        <thead>
          <tr>
            <th>Tipo</th>
            <th>Email</th>
            <th>Contraseña</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>Admin FENSTER</strong></td>
            <td><span class="value-box">admin@fenster.test</span></td>
            <td><span class="value-box">Fenster2026!</span></td>
          </tr>
          <tr>
            <td><strong>Comercial</strong></td>
            <td><span class="value-box">comercial@fenster.test</span></td>
            <td><span class="value-box">Fenster2026!</span></td>
          </tr>
          <tr>
            <td><strong>Partner (cliente)</strong></td>
            <td><span class="value-box">partner@fenster.test</span></td>
            <td><span class="value-box">Fenster2026!</span></td>
          </tr>
        </tbody>
      </table>

      <div class="link-container">
        <a href="https://town-unexpected-delivers-random.trycloudflare.com" target="_blank" class="btn-link" onclick="event.stopPropagation();">Probar Entorno de Pruebas &rarr;</a>
      </div>
    </div>
  </div>

  <script>
    function openEnvelope() {
      document.getElementById('envelopeContainer').classList.toggle('open');
    }
  </script>

</body>
</html>
